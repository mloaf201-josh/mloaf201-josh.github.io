<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursed Tides — Pirate Platformer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;color:#fff}
  #gameWrap{position:relative;border:2px solid #2a1a0a;box-shadow:0 0 40px rgba(100,50,10,0.3)}
  canvas{display:block;background:#0d0d14;image-rendering:pixelated}
  #ui{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
  #health{color:#c0392b;font-size:14px;text-shadow:0 0 10px rgba(192,57,43,0.5)}
  #minimap{width:80px;height:80px;border:1px solid #3a2a1a;background:rgba(10,10,15,0.8);position:relative}
  #minimap canvas{width:80px;height:80px}
  #controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;z-index:10;opacity:0.6}
  .ctrl-btn{width:44px;height:44px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);border-radius:4px;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;touch-action:none}
  .ctrl-btn:active{background:rgba(255,255,255,0.2)}
  #title-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,10,0.92);z-index:20;cursor:pointer}
  #title-overlay h1{font-size:28px;color:#8b4513;text-shadow:0 0 20px rgba(139,69,19,0.5);margin-bottom:8px;letter-spacing:4px}
  #title-overlay p{font-size:12px;color:#6a5a4a;margin-bottom:20px}
  #title-overlay .btn{font-size:14px;color:#c0392b;border:1px solid #c0392b;padding:8px 24px;cursor:pointer;background:transparent;font-family:inherit;letter-spacing:2px}
  #title-overlay .btn:hover{background:rgba(192,57,43,0.15)}
  #death-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,10,0.95);z-index:30}
  #death-overlay h2{font-size:24px;color:#8b0000;margin-bottom:8px;letter-spacing:6px}
  #death-overlay p{font-size:12px;color:#6a5a4a;margin-bottom:20px;font-style:italic}
  #death-overlay .btn{font-size:13px;color:#8b4513;border:1px solid #8b4513;padding:8px 24px;cursor:pointer;background:transparent;font-family:inherit}
  #death-overlay .btn:hover{background:rgba(139,69,19,0.15)}
  @media(max-width:600px){#minimap{width:60px;height:60px}#health{font-size:12px}}
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui">
    <div id="health">❤️ ❤️ ❤️ ❤️ ❤️</div>
    <div id="minimap"><canvas id="miniCanvas" width="80" height="80"></canvas></div>
  </div>
  
  <div id="controls">
    <div class="ctrl-btn" data-key="ArrowLeft">◀</div>
    <div class="ctrl-btn" data-key="ArrowUp">▲</div>
    <div class="ctrl-btn" data-key="ArrowDown">▼</div>
    <div class="ctrl-btn" data-key="ArrowRight">▶</div>
    <div class="ctrl-btn" data-key="z" style="color:#c0392b">⚔</div>
  </div>
  
  <div id="title-overlay">
    <h1>CURSED TIDES</h1>
    <p>A pirate's curse. One island. No escape.</p>
    <button class="btn" onclick="startGame()">⚓ RAISE ANCHOR</button>
    <p style="margin-top:16px;font-size:10px;color:#3a2a1a">Arrow keys to move · Z to attack</p>
  </div>
  
  <div id="death-overlay">
    <h2>CLAIMED BY THE DEEP</h2>
    <p>The sea god drags you into the abyss... but the map survives, waiting for the next fool.</p>
    <button class="btn" onclick="respawn()">🌀 RISE AGAIN</button>
  </div>
</div>

<script>
// ====== GAME ENGINE ======
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('miniCanvas');
const miniCtx = miniCanvas.getContext('2d');

const W = 800, H = 500;
canvas.width = W; canvas.height = H;

// ====== FIXED TIMESTEP ======
const TICK = 1/60;
let accumulator = 0;
let lastTime = 0;

// ====== INPUT ======
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; e.preventDefault(); });

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  btn.addEventListener('touchstart', e => { keys[btn.dataset.key] = true; e.preventDefault(); });
  btn.addEventListener('touchend', e => { keys[btn.dataset.key] = false; e.preventDefault(); });
  btn.addEventListener('mousedown', e => { keys[btn.dataset.key] = true; });
  btn.addEventListener('mouseup', e => { keys[btn.dataset.key] = false; });
});

// ====== AUDIO ======
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(freq, duration, type='square') {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ====== PIXEL ART GENERATOR ======
// Draws sprites programmatically for a pixelated look
function drawPixelCharacter(ctx, x, y, frame, facingRight, hurtFlash) {
  const p = 2; // pixel scale
  const bx = x - 8*p; // base x (16px wide * scale)
  const by = y - 16*p; // base y (32px tall * scale)
  
  ctx.save();
  if (!facingRight) {
    ctx.translate(x*2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-x, 0);
  }
  
  // Body color
  const bodyHue = hurtFlash ? '#ff4444' : '#2a1a1a';
  const skinHue = '#8b6a4a';
  const bootHue = '#1a0a0a';
  
  // Head (bandana)
  for(let py=1; py<=4; py++) for(let px=3; px<=12; px++) {
    const c = py<=2 ? '#8b0000' : skinHue;
    setPix(ctx, bx+px*p, by+py*p, c, p);
  }
  // Eye
  setPix(ctx, bx+10*p, by+3*p, '#ffff00', p);
  
  // Body/torso
  for(let py=5; py<=10; py++) for(let px=4; px<=13; px++) {
    setPix(ctx, bx+px*p, by+py*p, bodyHue, p);
  }
  // Belt
  for(let px=3; px<=14; px++) setPix(ctx, bx+px*p, by+10*p, '#3a2a0a', p);
  
  // Arms
  const armSwing = Math.sin(frame * 0.15) * 2;
  for(let py=6; py<=10; py++) {
    setPix(ctx, bx+3*p, by+py*p, skinHue, p);
    setPix(ctx, bx+14*p, by+py*p, skinHue, p);
  }
  // Sword arm extension when attacking
  if (keys['z'] || keys['Z']) {
    for(let px=14; px<=20; px++) setPix(ctx, bx+px*p, by+8*p, '#aaaaaa', p);
    setPix(ctx, bx+21*p, by+7*p, '#ff0000', p); // sword tip
  }
  
  // Legs
  const legAnim = Math.sin(frame * 0.1) * 2;
  for(let py=11; py<=15; py++) {
    setPix(ctx, bx+6*p, by+py*p, bootHue, p);
    setPix(ctx, bx+10*p, by+py*p, bootHue, p);
  }
  // Boots
  for(let px=5; px<=7; px++) setPix(ctx, bx+px*p, by+15*p, '#0a0a0a', p);
  for(let px=10; px<=12; px++) setPix(ctx, bx+px*p, by+15*p, '#0a0a0a', p);
  
  ctx.restore();
}

function setPix(ctx, x, y, c, s=2) {
  ctx.fillStyle = c;
  ctx.fillRect(x, y, s, s);
}

// ====== PARTICLES ======
let particles = [];
function addParticles(x, y, count, color, spread=3) {
  for(let i=0; i<count; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*spread,
      vy: -Math.random()*spread - 1,
      life: 1,
      maxLife: 20 + Math.random()*20,
      color,
      size: 1 + Math.random()*2
    });
  }
}

// ====== LEVEL ======
// Simple island dungeon layout (tile-based)
// 0=air, 1=ground, 2=wall, 3=spike, 4=platform
const TILE = 32;
const COLS = Math.ceil(W/TILE) + 10;
const ROWS = Math.ceil(H/TILE) + 2;

let level = [];
function generateLevel() {
  level = [];
  for(let r=0; r<ROWS; r++) {
    level[r] = [];
    for(let c=0; c<COLS; c++) {
      if(r >= ROWS-2) level[r][c] = 1; // floor
      else if(r >= ROWS-3 && c%5===0) level[r][c] = 1; // uneven floor
      else if(r < 2) level[r][c] = 2; // ceiling
      else if(r > 4 && r < ROWS-3 && c%7===3 && Math.random()<0.15) level[r][c] = 4; // platforms
      else level[r][c] = 0;
    }
  }
  
  // Add some walls
  for(let r=3; r<ROWS-2; r++) {
    level[r][10] = 2;
    level[r][COLS-10] = 2;
  }
  
  // Spikes
  for(let c=15; c<25; c++) level[ROWS-3][c] = 3;
  for(let c=COLS-20; c<COLS-12; c++) level[ROWS-3][c] = 3;
}
generateLevel();

// ====== GAME STATE ======
let gameRunning = false;
let frameCount = 0;

let player = {
  x: 3*TILE, y: (ROWS-4)*TILE,
  w: 16, h: 28,
  vx: 0, vy: 0,
  hp: 5, maxHp: 5,
  onGround: false,
  facingRight: true,
  attackTimer: 0,
  hurtTimer: 0,
  invincible: 0,
};

const SPEED = 2.8;
const JUMP = -7.5;
const GRAVITY = 0.35;

let enemies = [];
let screenShake = 0;

function spawnEnemies() {
  enemies = [];
  enemyPositions = [
    {x: 12*TILE, y: (ROWS-6)*TILE, type: 'grunt'},
    {x: 20*TILE, y: (ROWS-7)*TILE, type: 'grunt'},
    {x: 28*TILE, y: (ROWS-5)*TILE, type: 'grunt'},
    {x: 35*TILE, y: (ROWS-8)*TILE, type: 'grunt'},
    {x: 40*TILE, y: (ROWS-6)*TILE, type: 'elite'},
    {x: 50*TILE, y: (ROWS-7)*TILE, type: 'boss'},
  ];
  
  for(const ep of enemyPositions) {
    enemies.push({
      x: ep.x, y: ep.y,
      w: 20, h: 24,
      vx: 0, vy: 0,
      hp: ep.type === 'boss' ? 8 : (ep.type === 'elite' ? 4 : 2),
      maxHp: ep.type === 'boss' ? 8 : (ep.type === 'elite' ? 4 : 2),
      type: ep.type,
      onGround: false,
      hurtTimer: 0,
      attackCooldown: 0,
      alertRange: ep.type === 'boss' ? 400 : 200,
      phase: 0,
    });
  }
}
spawnEnemies();

// ====== COLLISION ======
function getTile(cx, cy) {
  const col = Math.floor(cx / TILE);
  const row = Math.floor(cy / TILE);
  if(row < 0 || row >= ROWS || col < 0 || col >= COLS) return 2;
  return level[row][col] || 0;
}

function solidAt(x, y) {
  const t = getTile(x, y);
  return t === 1 || t === 2;
}

function spikeAt(x, y) {
  return getTile(x, y) === 3;
}

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ====== UPDATE ======
let camX = 0;

function update() {
  if(!gameRunning) return;
  frameCount++;
  
  player.invincible = Math.max(0, player.invincible - 1);
  player.attackTimer = Math.max(0, player.attackTimer - 1);
  player.hurtTimer = Math.max(0, player.hurtTimer - 1);
  
  // Input
  let moveX = 0;
  if(keys['ArrowLeft'] || keys['a']) moveX = -1;
  if(keys['ArrowRight'] || keys['d']) moveX = 1;
  if(moveX !== 0) player.facingRight = moveX > 0;
  
  if((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) {
    player.vy = JUMP;
    player.onGround = false;
  }
  
  if(keys['z'] || keys['Z']) {
    if(player.attackTimer <= 0 && player.invincible <= 0) {
      player.attackTimer = 15;
      playBeep(220, 0.1, 'sawtooth');
      
      // Attack hitbox
      const ax = player.facingRight ? player.x + player.w : player.x - 24;
      const atkBox = {x: ax, y: player.y - 4, w: 24, h: player.h + 8};
      
      for(const e of enemies) {
        if(e.hp > 0 && rectCollide(atkBox, e)) {
          e.hp--;
          e.hurtTimer = 10;
          e.vx = (player.facingRight ? 4 : -4);
          e.vy = -2;
          screenShake = 6;
          addParticles(e.x + e.w/2, e.y + e.h/2, 8, '#8b0000');
          playBeep(440, 0.08, 'sawtooth');
        }
      }
    }
  }
  
  // Physics
  player.vx = moveX * SPEED;
  player.vy += GRAVITY;
  
  // X collision
  player.x += player.vx;
  const px = player.x, py = player.y;
  const margin = 2;
  if(solidAt(px + margin, py + margin) || solidAt(px + margin, py + player.h - margin) ||
     solidAt(px + player.w - margin, py + margin) || solidAt(px + player.w - margin, py + player.h - margin)) {
    player.x -= player.vx;
    player.vx = 0;
  }
  
  // Y collision
  player.y += player.vy;
  player.onGround = false;
  if(solidAt(px + margin, py + player.h) || solidAt(px + player.w - margin, py + player.h)) {
    if(player.vy > 0) {
      player.y = Math.floor((py + player.h) / TILE) * TILE - player.h;
      player.onGround = true;
    }
    player.vy = 0;
  }
  if(solidAt(px + margin, py) || solidAt(px + player.w - margin, py)) {
    if(player.vy < 0) {
      player.y = Math.ceil(py / TILE) * TILE + 1;
      player.vy = 0;
    }
  }
  
  // Spikes
  if(spikeAt(px + margin, py + player.h - margin) || spikeAt(px + player.w - margin, py + player.h - margin)) {
    if(player.invincible <= 0) {
      player.hp--;
      player.invincible = 30;
      player.vy = -4;
      screenShake = 8;
      playBeep(180, 0.2);
      addParticles(player.x + player.w/2, player.y + player.h/2, 12, '#ff4444');
    }
  }
  
  // Fall death
  if(player.y > H + 50) {
    player.hp = 0;
  }
  
  // Death
  if(player.hp <= 0) {
    gameRunning = false;
    document.getElementById('death-overlay').style.display = 'flex';
    playBeep(110, 0.5, 'sawtooth');
    addParticles(player.x + player.w/2, player.y + player.h/2, 30, '#8b0000');
    return;
  }
  
  // Camera
  camX = Math.max(0, Math.min(COLS*TILE - W, player.x - W/3));
  
  // Update enemies
  for(const e of enemies) {
    if(e.hp <= 0) continue;
    
    e.hurtTimer = Math.max(0, e.hurtTimer - 1);
    e.attackCooldown = Math.max(0, e.attackCooldown - 1);
    
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if(dist < e.alertRange) {
      // Move toward player
      const dir = dx > 0 ? 1 : -1;
      e.vx = dir * (e.type === 'boss' ? 1.5 : 0.8);
      
      // Jump if needed
      if(Math.random() < 0.02 && e.onGround) {
        e.vy = -6;
        e.onGround = false;
      }
    } else {
      e.vx *= 0.9;
    }
    
    // Physics
    e.vy += GRAVITY;
    e.x += e.vx;
    e.y += e.vy;
    
    // Ground collision
    e.onGround = false;
    const em = 2;
    if(solidAt(e.x + em, e.y + e.h) || solidAt(e.x + e.w - em, e.y + e.h)) {
      if(e.vy > 0) {
        e.y = Math.floor((e.y + e.h) / TILE) * TILE - e.h;
        e.onGround = true;
      }
      e.vy = 0;
    }
    
    // Attack player
    if(dist < 30 && e.attackCooldown <= 0 && player.invincible <= 0) {
      player.hp--;
      player.invincible = 30;
      player.vy = -3;
      screenShake = 6;
      playBeep(150, 0.15);
      addParticles(player.x + player.w/2, player.y + player.h/2, 8, '#ff4444');
      e.attackCooldown = 40;
    }
    
    // Death particles
    if(e.hp <= 0) {
      addParticles(e.x + e.w/2, e.y + e.h/2, 15, '#440000', 4);
      playBeep(330, 0.15, 'sawtooth');
    }
  }
  
  // Update particles
  screenShake = Math.max(0, screenShake - 1);
  for(const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

// ====== RENDER ======
function render() {
  ctx.save();
  
  // Screen shake
  if(screenShake > 0) {
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
  }
  
  // Background
  ctx.fillStyle = '#0d0d14';
  ctx.fillRect(0, 0, W, H);
  
  // Dark atmosphere gradient
  const grad = ctx.createRadialGradient(player.x-camX, player.y, 100, player.x-camX, player.y, 400);
  grad.addColorStop(0, 'rgba(30,20,40,0.1)');
  grad.addColorStop(1, 'rgba(5,5,10,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Draw level
  const startCol = Math.floor(camX / TILE);
  const endCol = Math.min(COLS, startCol + Math.ceil(W/TILE) + 2);
  
  for(let r=0; r<ROWS; r++) {
    for(let c=startCol; c<endCol; c++) {
      const t = level[r][c];
      if(t === 0) continue;
      
      const sx = c*TILE - camX;
      const sy = r*TILE;
      
      if(t === 1) {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#2a2a3e';
        ctx.fillRect(sx, sy, TILE, 2);
      } else if(t === 2) {
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(sx+2, sy+2, TILE-4, TILE-4);
      } else if(t === 3) {
        ctx.fillStyle = '#3a0a0a';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#8b0000';
        ctx.beginPath();
        ctx.moveTo(sx, sy+TILE);
        ctx.lineTo(sx+TILE/2, sy);
        ctx.lineTo(sx+TILE, sy+TILE);
        ctx.fill();
      } else if(t === 4) {
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(sx, sy+4, TILE, 3);
      }
    }
  }
  
  // Draw particles
  for(const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  
  // Draw enemies
  for(const e of enemies) {
    if(e.hp <= 0) continue;
    const sx = e.x - camX;
    const sy = e.y;
    
    // Enemy body
    const color = e.hurtTimer > 0 ? '#ff4444' : (e.type === 'boss' ? '#6b0000' : '#3a1a1a');
    ctx.fillStyle = color;
    ctx.fillRect(sx, sy, e.w, e.h);
    
    // Eyes
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(sx + 4, sy + 6, 4, 4);
    ctx.fillRect(sx + e.w - 8, sy + 6, 4, 4);
    
    // Boss crown
    if(e.type === 'boss') {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(sx + 2, sy - 8, e.w - 4, 6);
      ctx.fillRect(sx + 4, sy - 12, 3, 6);
      ctx.fillRect(sx + e.w/2 - 2, sy - 16, 4, 10);
      ctx.fillRect(sx + e.w - 7, sy - 12, 3, 6);
    }
    
    // HP bar
    if(e.hp < e.maxHp) {
      ctx.fillStyle = '#3a0a0a';
      ctx.fillRect(sx, sy - 6, e.w, 4);
      ctx.fillStyle = '#8b0000';
      ctx.fillRect(sx, sy - 6, e.w * (e.hp/e.maxHp), 4);
    }
  }
  
  // Draw player
  const px = player.x - camX;
  const py = player.y;
  const flash = player.invincible > 0 && player.invincible % 4 < 2;
  if(!flash) {
    drawPixelCharacter(ctx, px + player.w/2, py + player.h, frameCount, player.facingRight, player.hurtTimer > 0);
  }
  
  // Player HP bar
  ctx.fillStyle = '#1a0a0a';
  ctx.fillRect(10, 40, 102, 10);
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(11, 41, player.hp * 20, 8);
  
  // Torchlight effect around player
  const grad2 = ctx.createRadialGradient(px + player.w/2, py + player.h/2, 5, px + player.w/2, py + player.h/2, 80);
  grad2.addColorStop(0, 'rgba(255,150,50,0.05)');
  grad2.addColorStop(1, 'rgba(255,150,50,0)');
  ctx.fillStyle = grad2;
  ctx.fillRect(0, 0, W, H);
  
  ctx.restore();
  
  // Mini-map
  miniCtx.fillStyle = 'rgba(5,5,10,0.9)';
  miniCtx.fillRect(0, 0, 80, 80);
  
  const scale = 80 / (COLS * TILE);
  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {
      const t = level[r][c];
      if(t === 1 || t === 2) {
        miniCtx.fillStyle = t === 1 ? '#2a2a3e' : '#0a0a14';
        miniCtx.fillRect(c*TILE*scale, r*TILE*scale, Math.max(1, TILE*scale), Math.max(1, TILE*scale));
      }
    }
  }
  
  // Player dot on minimap
  miniCtx.fillStyle = '#ffff00';
  miniCtx.fillRect(player.x*scale - 1, player.y*scale - 1, 3, 3);
  
  // Enemy dots
  for(const e of enemies) {
    if(e.hp <= 0) continue;
    miniCtx.fillStyle = '#ff0000';
    miniCtx.fillRect(e.x*scale - 1, e.y*scale - 1, 2, 2);
  }
}

// ====== GAME LOOP ======
function gameLoop(timestamp) {
  const delta = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  
  accumulator += Math.min(delta, 0.1);
  while(accumulator >= TICK) {
    update();
    accumulator -= TICK;
  }
  
  render();
  
  // Health UI
  const hearts = document.getElementById('health');
  let heartStr = '';
  for(let i=0; i<player.maxHp; i++) {
    heartStr += i < player.hp ? '❤️ ' : '🖤 ';
  }
  hearts.textContent = heartStr;
  
  requestAnimationFrame(gameLoop);
}

// ====== START / RESPAWN ======
function startGame() {
  document.getElementById('title-overlay').style.display = 'none';
  player.x = 3*TILE;
  player.y = (ROWS-4)*TILE;
  player.hp = player.maxHp;
  player.vx = 0; player.vy = 0;
  gameRunning = true;
}

function respawn() {
  document.getElementById('death-overlay').style.display = 'none';
  player.x = 3*TILE;
  player.y = (ROWS-4)*TILE;
  player.hp = player.maxHp;
  player.vx = 0; player.vy = 0;
  spawnEnemies();
  generateLevel();
  gameRunning = true;
}

// ====== BOOT ======
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
