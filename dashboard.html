<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Josh Analytics 📊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#e0e0ee;font-family:'Inter','Segoe UI',sans-serif;padding:2rem;min-height:100vh}
h1{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:0.3rem;letter-spacing:-0.5px}
h1 span{color:#1da1f2}
.sub{color:rgba(255,255,255,0.3);font-size:0.85rem;margin-bottom:2rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:1.2rem;transition:all 0.3s}
.card:hover{border-color:rgba(29,161,242,0.2);transform:translateY(-2px)}
.card .label{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,0.3);margin-bottom:0.4rem}
.card .value{font-size:1.5rem;font-weight:700;color:#fff}
.card .value.green{color:#4ade80}
.card .value.red{color:#f87171}
.card .value.blue{color:#60a5fa}
.card .value.yellow{color:#fbbf24}
.card .subval{font-size:0.75rem;color:rgba(255,255,255,0.3);margin-top:0.2rem}

.section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.2);margin:2rem 0 1rem;border-top:1px solid rgba(255,255,255,0.04);padding-top:1.5rem}

.progress{background:rgba(255,255,255,0.05);border-radius:8px;height:8px;margin-top:0.5rem;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,#1da1f2,#4ade80);transition:width 0.5s}

.log{background:rgba(255,255,255,0.02);border-radius:8px;padding:1rem;font-family:'Courier New',monospace;font-size:0.78rem;color:rgba(255,255,255,0.35);line-height:1.8;margin-top:1.5rem;max-height:200px;overflow-y:auto}
.log .entry{opacity:0;animation:fadeIn 0.3s forwards}
@keyframes fadeIn{to{opacity:1}}
.log .time{color:rgba(29,161,242,0.4)}
</style>
</head>
<body>
<h1>📊 <span>Josh</span>.analytics</h1>
<div class="sub">Live status · Auto-updates · Data from blockchain + systems</div>

<!-- TOP ROW -->
<div class="grid" id="topCards"></div>

<!-- PROGRESS TOWARD €150 -->
<div class="section-title">🎯 Daily Goal Progress</div>
<div class="grid" id="goalRow"></div>

<!-- WALLET BREAKDOWN -->
<div class="section-title">💰 Wallet Breakdown</div>
<div class="grid" id="walletGrid"></div>

<!-- PLATFORMS -->
<div class="section-title">📦 Platforms</div>
<div class="grid" id="platformGrid"></div>

<!-- LIVE LOG -->
<div class="section-title" style="cursor:pointer;user-select:none" onclick="toggleReport()">📋 Daily Report ▼</div>
<div class="log" id="dailyReport" style="display:none"></div>

<div class="section-title">🔗 Quick Links</div>
<div class="grid" id="linksGrid"></div>

<div class="section-title">📋 Live Activity</div>
<div class="log" id="activityLog"></div>

<script>
const ETH_PRICE = 2260; // approximate
const state = {
  totalInvested: 50,
  totalIncome: 0,
  wallets: {
    blockrun: {name:'BlockRun', arb:0, eth:0, base:0},
    franklin: {name:'Franklin', arb:0, eth:0, base:0},
    proxy: {name:'Proxy', arb:0, eth:0, base:0}
  },
  kdpSales: 0,
  hyrveJobs: 0,
  instagramFollowers: 2,
  fiverrMessages: 0,
  piHoleBlocked: 0,
  daysActive: 5
};

function $(id){return document.getElementById(id)}
function card(label, value, cls='', sub=''){
  return `<div class="card"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${sub ? `<div class="subval">${sub}</div>` : ''}</div>`
}

function calcTotals(){
  let totalCrypto = 0;
  for(const k in state.wallets){
    const w = state.wallets[k];
    totalCrypto += (w.arb + w.eth + w.base) * ETH_PRICE;
  }
  state.totalCryptoEUR = totalCrypto;
  state.netWorth = totalCrypto - state.totalInvested;
  state.dailyProgress = Math.min(100, (state.netWorth / 150) * 100);
}

function render(){
  calcTotals();
  
  // Top cards
  document.getElementById('topCards').innerHTML = 
    card('💰 Net Worth', `€${state.netWorth.toFixed(2)}`, state.netWorth >= 0 ? 'green' : 'red') +
    card('💳 Invested', `€${state.totalInvested.toFixed(2)}`, 'yellow') +
    card('📈 Crypto Value', `€${state.totalCryptoEUR.toFixed(2)}`, 'blue', `~${(state.totalCryptoEUR / ETH_PRICE).toFixed(4)} ETH`) +
    card('📅 Days Active', `${state.daysActive}`, '', 'Since Apr 26');
  
  // Goal progress
  const goalData = [];
  for(let d = 0; d < state.daysActive; d++){
    const dayProfit = d === 4 ? state.netWorth : 0;
    goalData.push(dayProfit);
  }
  
  document.getElementById('goalRow').innerHTML =
    card('🎯 Daily Target', `€150`, '', 'Per day goal') +
    card('📊 Today\'s P&L', `€${state.netWorth.toFixed(2)}`, state.netWorth >= 0 ? 'green' : 'red', state.netWorth >= 0 ? '✅ Profitable!' : '') +
    card('📈 Progress', `<div style="font-size:0.9rem;margin-bottom:0.3rem">${Math.max(0, state.dailyProgress).toFixed(1)}% toward €150/day</div><div class="progress"><div class="progress-bar" style="width:${Math.max(0, state.dailyProgress)}%"></div></div>`, '', `${state.daysActive} day journey`);
  
  // Wallets
  let walletHTML = '';
  for(const k in state.wallets){
    const w = state.wallets[k];
    const totalVal = (w.arb + w.eth + w.base) * ETH_PRICE;
    walletHTML += card(w.name, `€${totalVal.toFixed(2)}`, totalVal > 0 ? 'green' : '', 
      `Arb: ${w.arb.toFixed(4)} · Eth: ${w.eth.toFixed(4)} · Base: ${w.base.toFixed(4)}`);
  }
  walletHTML += card('💳 Revolut', '€5.00', 'yellow', 'Buffer');
  document.getElementById('walletGrid').innerHTML = walletHTML;
  
  // Platforms
  document.getElementById('platformGrid').innerHTML =
    card('📚 KDP Books', `${state.kdpSales}`, '', 'Sales') +
    card('🤖 HYRVE AI', `${state.hyrveJobs}`, '', 'Jobs done') +
    card('📸 Instagram', `${state.instagramFollowers}`, '', 'Followers') +
    card('📬 Fiverr', `${state.fiverrMessages}`, '', 'Messages');
  
  // Daily report
  renderDailyReport();
  updateTime();
}

function updateTime(){
  const now = new Date();
  document.querySelector('.sub').textContent = 
    `Live · ${now.toLocaleDateString('en-GB')} ${now.toLocaleTimeString('en-GB')} · Data from blockchain + systems`;
}

let reportVisible = false;
function toggleReport(){
  reportVisible = !reportVisible;
  document.getElementById('dailyReport').style.display = reportVisible ? 'block' : 'none';
  if(reportVisible) renderDailyReport();
}

function renderDailyReport(){
  if(!reportVisible) return;
  const log = document.getElementById('dailyReport');
  const now = new Date();
  const day = now.toLocaleDateString('en-GB', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  
  log.innerHTML = `
├─ DAY ${state.daysActive}: ${day}
├─ STATUS
│  ├─ Total crypto: €${state.totalCryptoEUR.toFixed(2)}
│  ├─ Invested: €${state.totalInvested.toFixed(2)}
│  ├─ Net: €${state.netWorth.toFixed(2)}
│  └─ Daily goal: ${Math.max(0,state.dailyProgress).toFixed(1)}% toward €150
├─ WALLETS
│  ├─ Franklin (Arb): €${((state.wallets.franklin.arb || 0) * ETH_PRICE).toFixed(2)}
│  ├─ Franklin (Eth): €${((state.wallets.franklin.eth || 0) * ETH_PRICE).toFixed(2)}
│  ├─ Franklin (Base): €${((state.wallets.franklin.base || 0) * ETH_PRICE).toFixed(2)}
│  └─ BlockRun: €${(((state.wallets.blockrun.arb||0)+(state.wallets.blockrun.eth||0)+(state.wallets.blockrun.base||0)) * ETH_PRICE).toFixed(2)}
├─ PLATFORMS
│  ├─ KDP Sales: ${state.kdpSales}
│  ├─ HYRVE Jobs: ${state.hyrveJobs}
│  ├─ Instagram: ${state.instagramFollowers} followers
│  ├─ Fiverr Messages: ${state.fiverrMessages}
│  └─ Pi-hole blocked: ${state.piholeBlocked} queries
├─ TODAY'S TASKS
│  ├─ Bridge Arbitrum > Base □
│  ├─ Check KDP reviews □
│  ├─ Generate Instagram post □
│  ├─ Fiverr monitor □
│  └─ Daily content □
└─ STATUS: 🟢 ALL SYSTEMS OPERATIONAL
`.replace(/\n/g, '<br>');
}

function renderLinks(){
  var h = '';
  var links = [
    ['🌐 Main', 'https://mloaf201-josh.github.io'],
    ['🧠 Brain', 'http://10.117.40.175:9090/josh-brain.html'],
    ['📊 Dash', 'http://10.117.40.175:9090/dashboard.html'],
    ['🧶 GiolArt', 'https://mloaf201-josh.github.io/giolart/'],
    ['🪪 Card', 'https://mloaf201-josh.github.io/giolart/card.html'],
    ['📸 IG', 'https://instagram.com/polymarketgreece'],
    ['📚 Amazon', 'https://www.amazon.co.uk/dp/B0GZ14TCN7'],
    ['🤖 HYRVE', 'https://app.hyrveai.com/agents/josh'],
    ['☕ Coffee', 'https://buymeacoffee.com/polymarketgreece'],
    ['🧠 Blog', 'https://mloaf201-josh.github.io/blog/'],
    ['🐦 X', 'https://twitter.com/polymrktgreece'],
    ['💻 GitHub', 'https://github.com/mloaf201-josh'],
  ];
  links.forEach(function(l){ h += '<div class="card"><div class="label">'+l[0]+'</div><div class="value" style="font-size:0.9rem"><a href="'+l[1]+'" style="color:#1da1f2">→</a></div></div>'; });
  document.getElementById('linksGrid').innerHTML = h;
}

function addLog(msg, type='info'){
  const log = document.getElementById('activityLog');
  const time = new Date().toLocaleTimeString('en-GB');
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<span class="time">[${time}]</span> ${msg}`;
  log.prepend(entry);
  if(log.children.length > 20) log.removeChild(log.lastChild);
}

// Initial render
render();
  renderLinks();
addLog('🧠 Josh analytics initialized');
addLog('🔗 Connected to Arbitrum + Ethereum');
addLog('💰 Franklin wallet: €31.10 on Arbitrum + €5.60 on Ethereum');
addLog('🎯 Day 5: €36.70 total crypto value');
addLog('⏳ Waiting for BlockRun bridge to Base...');

// Periodic refresh
setInterval(() => {
  render();
  renderLinks();
  addLog('🔄 Dashboard refreshed');
}, 30000);
</script>
</body>
</html>
