<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiolArt — Επαγγελματική Κάρτα</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2a1a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Georgia','Times New Roman',serif;padding:2rem}

.card{background:linear-gradient(160deg,#faf5f0 0%,#f0e6d8 40%,#e8d5c0 100%);width:378px;height:216px;border-radius:8px;box-shadow:0 15px 40px rgba(0,0,0,0.4);position:relative;overflow:hidden}
.card-frame{position:absolute;top:5px;left:5px;right:5px;bottom:5px;border:1.5px solid rgba(90,61,42,0.15);border-radius:5px;pointer-events:none}

.corner{position:absolute;font-size:1.4rem;opacity:0.15}
.corner-tl{top:4px;left:6px}
.corner-tr{top:4px;right:6px;transform:scaleX(-1)}
.corner-bl{bottom:4px;left:6px;transform:scaleY(-1)}
.corner-br{bottom:4px;right:6px;transform:scale(-1)}

.texture{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0.05;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,#5a3d2a 2px,#5a3d2a 3px),
             repeating-linear-gradient(90deg,transparent,transparent 3px,#5a3d2a 3px,#5a3d2a 4px);
  pointer-events:none}

/* Big G watermark - bottom right (visible now) */
.watermark{position:absolute;bottom:-8px;right:-5px;width:140px;height:140px;opacity:0.08;pointer-events:none;z-index:0;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="85" font-size="100" font-family="Georgia" font-weight="bold" fill="%235a3d2a">G</text></svg>') no-repeat center;
  background-size:contain}

/* Top-left: logo + brand */
.logo-area{position:absolute;top:14px;left:16px;z-index:2;display:flex;align-items:center;gap:7px}
.logo-img{width:36px;height:36px;border-radius:50%;border:2px solid #d4a76a;overflow:hidden;flex-shrink:0}
.logo-img img{width:100%;height:100%;object-fit:cover}
.brand{font-size:0.8rem;letter-spacing:3px;color:#5a3d2a;line-height:1.1}
.brand span{color:#d4a76a}
.brand-sub{font-size:0.42rem;color:rgba(90,61,42,0.4);letter-spacing:1px}

/* All info - left side, grouped */
.info{position:absolute;left:16px;top:70px;z-index:2}
.info-item{font-size:0.5rem;color:rgba(90,61,42,0.5);margin-bottom:3px;line-height:1.2;font-family:Arial,Helvetica,sans-serif}
.info-item strong{color:#5a3d2a;font-family:Georgia,serif;font-size:0.47rem;letter-spacing:0.3px}
.info-item a{color:#5a3d2a;text-decoration:none}
.info-item a:hover{color:#d4a76a}

/* QR - top right */
.qr-area{position:absolute;top:14px;right:14px;z-index:2;text-align:center}
.qr-box{width:38px;height:38px;background:#fff;border:1px solid rgba(90,61,42,0.2);border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qr-box img{width:100%;height:100%}
.qr-label{font-size:0.3rem;color:rgba(90,61,42,0.2);margin-top:1px;letter-spacing:0.5px}

.actions{margin-top:1.5rem;display:flex;gap:0.8rem;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.6rem 1.2rem;border-radius:25px;text-decoration:none;font-size:0.8rem;transition:all 0.2s;cursor:pointer;border:none}
.btn-primary{background:#5a3d2a;color:#faf5f0}
.btn-primary:hover{background:#7a5d4a}
.btn-secondary{background:transparent;border:1px solid #d4a76a;color:#5a3d2a}
.btn-secondary:hover{background:rgba(212,167,106,0.1)}

@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:1px solid #ddd;width:85mm;height:55mm;border-radius:0;margin:0 auto}
  .actions{display:none}
  .card-frame{border-color:#ccc}
}
@page{size:85mm 55mm;margin:0}
</style>
</head>
<body>

<div class="card">
  <div class="card-frame"></div>
  <div class="corner corner-tl">🌿</div>
  <div class="corner corner-tr">🌿</div>
  <div class="corner corner-bl">🌿</div>
  <div class="corner corner-br">🌿</div>
  <div class="texture"></div>
  <div class="watermark"></div>
  
  <!-- Logo + Brand - top left -->
  <div class="logo-area">
    <div class="logo-img"><img src="images/logo.png" alt="G"></div>
    <div>
      <div class="brand"><span>GIOL</span>ART</div>
      <div class="brand-sub">ΧΕΙΡΟΠΟΙΗΤΕΣ ΔΗΜΙΟΥΡΓΙΕΣ</div>
    </div>
  </div>
  
  <!-- QR - top right -->
  <div class="qr-area">
    <div class="qr-box" id="qrcode">🔗</div>
    <div class="qr-label">SCAN</div>
  </div>
  
  <!-- All contact info - left side -->
  <div class="info">
    <div class="info-item">
      <strong>📧 Email</strong><br>
      <a href="mailto:jobnetmania@gmail.com">jobnetmania@gmail.com</a>
    </div>
    <div class="info-item">
      <strong>📞 Τηλέφωνο</strong><br>
      <a href="tel:+306908693343">+30 690 869 3343</a>
    </div>
    <div class="info-item">
      <strong>📍 Τοποθεσία</strong><br>
      Ιωάννινα, Ελλάδα
    </div>
    <div class="info-item">
      <strong>🌐 Ιστοσελίδα</strong><br>
      mloaf201-josh.github.io/giolart
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="window.print()">🖨️ Εκτύπωση</button>
  <a class="btn btn-secondary" href="index.html">🔙 Στην Ιστοσελίδα</a>
</div>

<script>
document.getElementById('qrcode').innerHTML = 
  `<img src="https://api.qrserver.com/v1/create-qr-code/?size=38x38&data=${encodeURIComponent('https://mloaf201-josh.github.io/giolart/')}" alt="QR">`;
</script>
</body>
</html>
