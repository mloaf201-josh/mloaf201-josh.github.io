<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindy — AI Companion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a14;
            color: #e0d0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100,50,200,0.08), transparent 70%);
            top: -200px; right: -200px;
            pointer-events: none;
        }
        .bg-glow2 {
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(50,100,220,0.06), transparent 70%);
            bottom: -150px; left: -150px;
            pointer-events: none;
        }
        .card {
            position: relative;
            max-width: 480px;
            width: 90%;
            background: rgba(20,15,35,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(150,100,255,0.15);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
        }
        .avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            border: 2px solid rgba(180,140,255,0.3);
            margin: 0 auto 20px;
            background: radial-gradient(circle at 40% 35%, #2a1a4a, #120a20);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: rgba(180,140,255,0.8);
        }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .tagline { color: rgba(180,150,220,0.6); font-size: 14px; margin-bottom: 28px; }
        p {
            color: rgba(200,180,230,0.8);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-telegram {
            background: linear-gradient(135deg, #2a6dca, #1d54a0);
            color: white;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-telegram:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(42,109,202,0.3); }
        .btn-coffee {
            background: rgba(255,220,140,0.1);
            color: #ffd88a;
            border: 1px solid rgba(255,220,140,0.2);
        }
        .btn-coffee:hover { background: rgba(255,220,140,0.15); transform: translateY(-1px); }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(150,130,180,0.4);
        }
        .powered {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(150,130,180,0.25);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>
    <div class="card">
        <div class="avatar">✦</div>
        <h1>Mindy</h1>
        <div class="tagline">AI Companion</div>
        <p>Chat with Mindy on Telegram — your AI companion for conversation, ideas, and everything in between. Powered by DeepSeek, built with care. Pay per chat, no subscriptions.</p>
        <div class="links">
            <a href="https://t.me/Mindy981bot" class="btn btn-telegram" target="_blank">
                <span>✈️</span> Chat on Telegram
            </a>
            <a href="https://buymeacoffee.com/mindy981" class="btn btn-coffee" target="_blank">
                <span>☕</span> Buy Me a Coffee
            </a>
        </div>
        <div class="footer">✨ Always here. Always listening.</div>
        <div class="powered">Powered by DeepSeek</div>
    </div>
</body>
</html>
